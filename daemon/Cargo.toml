[package]
name = "canopy-worktree"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Git worktree dev environments driven by canopy.yaml: create, provision and supervise a worktree without a daemon"
repository = "https://github.com/igaurab/canopy-worktree"
license = "MIT OR Apache-2.0"
keywords = ["git", "worktree", "devenv", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/tests"]

[[bin]]
name = "canopywt"
path = "src/bin/canopywt.rs"

[features]
# TypeScript bindings. Off in a normal build: `ts-rs` is a codegen tool, not something a
# consumer of the library should have to compile. The dev-dependency on this package below
# turns it on for `cargo test`, so `tests/schema.rs` can emit the bindings itself rather than
# depending on a lib unit test having run first.
ts = ["dep:ts-rs"]

[dependencies]
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
fs4 = "1.1"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
reflink-copy = "0.1"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.2.0"
serde_ignored = "0.1.14"
serde_json = "1.0"
signal-hook = "0.4.4"
thiserror = "2.0"
ts-rs = { version = "12.0", optional = true }
ureq = "3.4"

[dev-dependencies]
assert_cmd = "2.2"
# This package, as its own dev-dependency: the only way to enable a feature for tests alone.
canopy-worktree = { path = ".", features = ["ts"] }
insta = { version = "1.48", features = ["json", "redactions"] }
jsonschema = "0.56"
predicates = "3.1"
rstest = "0.27"
tempfile = "3.27"

[profile.release]
strip = true
