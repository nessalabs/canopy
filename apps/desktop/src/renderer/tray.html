<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canopy</title>
    <!--
      The panel reaches the daemon only through the main process, so unlike index.html it needs
      no HTTP origins at all — just the dev server's HMR socket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tray/main.tsx"></script>
  </body>
</html>
