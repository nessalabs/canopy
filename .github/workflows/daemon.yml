# The Rust half of the repository: the `canopy-worktree` crate in daemon/, which builds the
# `canopywt` binary canopyd shells out to. Runs only when that directory changes.
name: daemon

on:
  push:
    branches: [main]
    paths: [daemon/**, .github/workflows/daemon.yml]
  pull_request:
    paths: [daemon/**, .github/workflows/daemon.yml]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: daemon

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # The suite shells out to git; make sure the runner's identity cannot leak into a
      # fixture the way a developer's global config could.
      - run: git --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # `--all-targets` skips doctests, which is where the documentation examples live.
      - run: cargo test --doc
